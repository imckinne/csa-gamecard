<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay Generator - Pro Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
        
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background: #121212; color: #fff; }
        
        /* Left Panel - Settings */
        .controls { width: 35%; padding: 25px; background: #1e1e1e; border-right: 1px solid #333; overflow-y: auto; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        .section { margin-bottom: 25px; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 8px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input[type="color"] { padding: 2px; height: 35px; cursor: pointer; }
        input:focus, select:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }

        /* Right Panel - Live Preview */
        .preview-container { width: 65%; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; background: #0a0a0a; }
        .preview-label { margin-bottom: 15px; color: #888; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
        
        .overlay-preview-wrapper {
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 1920 / 250;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* The styles below are shared between the preview and the hidden PDF engine to guarantee identical rendering */
        .overlay-master {
            width: 100%; height: 100%; position: relative;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Teko', sans-serif; /* Blocky athletic font */
        }

        /* Outer Orange-to-Blue Gradient Border */
        .gradient-border-box {
            width: 95%; height: 65%;
            background: linear-gradient(90deg, #ff7e00, #0055ff);
            padding: 4px;
            border-radius: 12px;
            display: flex;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Inner Background (Blurred city/texture simulator) */
        .inner-bg {
            width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 25, 35, 0.75), rgba(15, 25, 35, 0.75)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.1"><rect width="100" height="100" fill="%23fff"/><circle cx="50" cy="50" r="40" fill="%23000"/></svg>');
            border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; box-sizing: border-box;
        }

        /* Team Gradients & Boxes */
        .team-panel {
            display: flex; align-items: center; justify-content: space-between;
            height: 75%; width: 38%;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 0 20px; box-sizing: border-box;
        }
        
        .details-col { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .team-name { font-size: 2.8vw; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; line-height: 1; border-bottom: 3px solid #fff; padding-bottom: 2px; margin-bottom: 2px; }
        .team-record { font-size: 1.5vw; font-weight: 500; letter-spacing: 3px; line-height: 1; color: #e0e0e0; }
        .team-score { font-size: 3.5vw; font-weight: 700; line-height: 1; }

        /* Logo Boxes */
        .logo-box {
            background: radial-gradient(circle, #ffffff, #e0e0e0);
            height: 90%; aspect-ratio: 1/1;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            padding: 5px; box-sizing: border-box;
            border: 1px solid #ccc;
        }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Absolute Center Crest */
        .center-crest {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            height: 90%; width: auto; object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.7));
            z-index: 10;
        }

        /* --- PDF Engine Exact Pixel Overrides --- */
        #pdf-template {
            position: absolute; left: -9999px; top: -9999px;
            width: 1920px; height: 250px;
        }
        #pdf-template .gradient-border-box { height: 160px; border-radius: 16px; padding: 5px; }
        #pdf-template .inner-bg { border-radius: 11px; padding: 0 25px; }
        #pdf-template .team-panel { height: 120px; border: 3px solid rgba(255,255,255,0.8); padding: 0 40px; }
        #pdf-template .team-name { font-size: 55px; border-bottom: 4px solid #fff; padding-bottom: 4px; margin-bottom: 4px; }
        #pdf-template .team-record { font-size: 30px; }
        #pdf-template .team-score { font-size: 70px; }
        #pdf-template .logo-box { height: 140px; border-radius: 12px; padding: 10px; }
        #pdf-template .center-crest { height: 230px; }
    </style>
</head>
<body>

    <!-- Left Panel: Settings -->
    <div class="controls">
        <h2>Overlay Settings</h2>
        
        <div class="section">
            <div class="form-row">
                <div class="form-group"><label>Left Team Name</label><input type="text" id="leftName" value="AFFINITY" onkeyup="updatePreview()"></div>
                <div class="form-group"><label>Left Score</label><input type="number" id="leftScore" value="7" onkeyup="updatePreview()" onchange="updatePreview()"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Left Record</label><input type="text" id="leftRecord" value="6-4" onkeyup="updatePreview()"></div>
                <div class="form-group"><label>Left Color</label><input type="color" id="leftColor" value="#990000" oninput="updatePreview()"></div>
            </div>
            <div class="form-group">
                <label>Left Team Logo</label>
                <select id="leftLogo" onchange="updatePreview()"></select>
            </div>
        </div>

        <div class="section">
            <div class="form-row">
                <div class="form-group"><label>Right Team Name</label><input type="text" id="rightName" value="DICE" onkeyup="updatePreview()"></div>
                <div class="form-group"><label>Right Score</label><input type="number" id="rightScore" value="13" onkeyup="updatePreview()" onchange="updatePreview()"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Right Record</label><input type="text" id="rightRecord" value="4-6" onkeyup="updatePreview()"></div>
                <div class="form-group"><label>Right Color</label><input type="color" id="rightColor" value="#b8860b" oninput="updatePreview()"></div>
            </div>
            <div class="form-group">
                <label>Right Team Logo</label>
                <select id="rightLogo" onchange="updatePreview()"></select>
            </div>
        </div>

        <button onclick="generatePDF()">Download Overlay PDF</button>
    </div>

    <!-- Right Panel: Live Preview -->
    <div class="preview-container">
        <div class="preview-label">Live Preview</div>
        <div class="overlay-preview-wrapper">
            <div class="overlay-master">
                <div class="gradient-border-box">
                    <div class="inner-bg">
                        
                        <!-- Left Team -->
                        <div class="team-panel left-panel-bg">
                            <div class="team-score" id="prev-left-score">7</div>
                            <div class="details-col">
                                <div class="team-name" id="prev-left-name">AFFINITY</div>
                                <div class="team-record" id="prev-left-record">6-4</div>
                            </div>
                        </div>
                        
                        <!-- Left Logo Box -->
                        <div class="logo-box"><img id="prev-left-img" src="" alt=""></div>
                        
                        <!-- Center Spacing Area -->
                        <div style="width: 15%;"></div>

                        <!-- Right Logo Box -->
                        <div class="logo-box"><img id="prev-right-img" src="" alt=""></div>

                        <!-- Right Team -->
                        <div class="team-panel right-panel-bg">
                            <div class="details-col">
                                <div class="team-name" id="prev-right-name">DICE</div>
                                <div class="team-record" id="prev-right-record">4-6</div>
                            </div>
                            <div class="team-score" id="prev-right-score">13</div>
                        </div>

                    </div>
                </div>
                <!-- Absolute Center Crest -->
                <img class="center-crest" src="csa5.png" alt="Center Crest">
            </div>
        </div>
    </div>

    <!-- Hidden Exact 1920x250 Layout for PDF Engine -->
    <div id="pdf-template" class="overlay-master">
        <div class="gradient-border-box">
            <div class="inner-bg">
                
                <div class="team-panel left-panel-bg">
                    <div class="team-score" id="pdf-left-score">7</div>
                    <div class="details-col">
                        <div class="team-name" id="pdf-left-name">AFFINITY</div>
                        <div class="team-record" id="pdf-left-record">6-4</div>
                    </div>
                </div>
                
                <div class="logo-box"><img id="pdf-left-img" src=""></div>
                <div style="width: 15%;"></div>
                <div class="logo-box"><img id="pdf-right-img" src=""></div>

                <div class="team-panel right-panel-bg">
                    <div class="details-col">
                        <div class="team-name" id="pdf-right-name">DICE</div>
                        <div class="team-record" id="pdf-right-record">4-6</div>
                    </div>
                    <div class="team-score" id="pdf-right-score">13</div>
                </div>

            </div>
        </div>
        <img class="center-crest" src="csa5.png">
    </div>

    <script>
        // Populate Logo Dropdowns
        const logos = [
            "AKR.png", "AKR_2.png", "ANC.png", "ANC_2.png", "ASH.png", "ASH_2.png", "ATL.png", "ATL_2.png",
            "BAL.png", "BAL_2.png", "CHI.png", "CHI_2.png", "CIN.png", "CIN_2.png", "DEN.png", "DEN_2.png",
            "DET.png", "DET_2.png", "EDM.png", "EDM_2.png", "HON.png", "HOU.png", "KCT.png", "LAT.png",
            "LIT.png", "MAD.png", "MCM.png", "MIN.png", "MKE.png", "NOJ.png", "OKC.png", "PHX.png",
            "PIT.png", "RAL.png", "RCH.png", "ROC.png", "SAN.png", "SAV.png", "SDG.png", "SEA.png",
            "TOR.png", "VBN.png"
        ];

        const leftSelect = document.getElementById('leftLogo');
        const rightSelect = document.getElementById('rightLogo');

        logos.forEach(logo => {
            leftSelect.add(new Option(logo.replace('.png', ''), logo));
            rightSelect.add(new Option(logo.replace('.png', ''), logo));
        });

        // Set default right logo (simulating 'OKC/DICE')
        rightSelect.value = "OKC.png";

        // Sync inputs to the UI and hidden PDF template
        function updatePreview() {
            const lLogo = document.getElementById('leftLogo').value;
            const rLogo = document.getElementById('rightLogo').value;
            const lName = document.getElementById('leftName').value || 'TEAM A';
            const rName = document.getElementById('rightName').value || 'TEAM B';
            const lScore = document.getElementById('leftScore').value || '0';
            const rScore = document.getElementById('rightScore').value || '0';
            const lRecord = document.getElementById('leftRecord').value || '0-0';
            const rRecord = document.getElementById('rightRecord').value || '0-0';
            
            // Handle Custom Colors (fading into black)
            const lColor = document.getElementById('leftColor').value;
            const rColor = document.getElementById('rightColor').value;
            const leftGradients = document.querySelectorAll('.left-panel-bg');
            const rightGradients = document.querySelectorAll('.right-panel-bg');
            
            leftGradients.forEach(el => el.style.background = `linear-gradient(to right, ${lColor}, #000000)`);
            rightGradients.forEach(el => el.style.background = `linear-gradient(to right, #000000, ${rColor})`);

            // Update visible preview
            document.getElementById('prev-left-img').src = lLogo;
            document.getElementById('prev-right-img').src = rLogo;
            document.getElementById('prev-left-name').innerText = lName;
            document.getElementById('prev-right-name').innerText = rName;
            document.getElementById('prev-left-score').innerText = lScore;
            document.getElementById('prev-right-score').innerText = rScore;
            document.getElementById('prev-left-record').innerText = lRecord;
            document.getElementById('prev-right-record').innerText = rRecord;

            // Update hidden PDF engine layout
            document.getElementById('pdf-left-img').src = lLogo;
            document.getElementById('pdf-right-img').src = rLogo;
            document.getElementById('pdf-left-name').innerText = lName;
            document.getElementById('pdf-right-name').innerText = rName;
            document.getElementById('pdf-left-score').innerText = lScore;
            document.getElementById('pdf-right-score').innerText = rScore;
            document.getElementById('pdf-left-record').innerText = lRecord;
            document.getElementById('pdf-right-record').innerText = rRecord;
        }

        // Generate the PDF
        function generatePDF() {
            const element = document.getElementById('pdf-template');
            
            // Force the browser to wait until all chosen images buffer into memory
            const images = element.querySelectorAll('img');
            const imageLoadPromises = Array.from(images).map(img => {
                return new Promise((resolve) => {
                    if (img.complete) return resolve();
                    img.onload = resolve;
                    img.onerror = resolve; // Continue even if an image breaks
                });
            });

            Promise.all(imageLoadPromises).then(() => {
                const opt = {
                    margin: 0,
                    filename: 'Pro_Stream_Overlay.pdf',
                    image: { type: 'png', quality: 1 },
                    html2canvas: { scale: 1, width: 1920, height: 250, useCORS: true, backgroundColor: null }, 
                    jsPDF: { unit: 'px', format: [1920, 250], orientation: 'landscape' }
                };
                html2pdf().set(opt).from(element).save();
            });
        }

        // Initialize on load
        window.onload = () => {
            // Load Google Font dynamically before rendering
            document.fonts.ready.then(updatePreview);
        };
    </script>

</body>
</html>
